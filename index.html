<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spectrum — The Industrial Story of Marathwada | CMIA</title>
<meta name="description" content="The industrial story of Marathwada — presented by the Chamber of Marathwada Industries &amp; Agriculture." />
<style>
  /* ============================================================
     PRESENTATION SHELL
     ------------------------------------------------------------
     A single persistent document holding the whole deck in one
     full-viewport iframe. It exists for exactly one reason: the
     Fullscreen API is tied to a Document, and every slide is its
     own file — so requesting fullscreen inside a slide can't
     survive the arrows navigating to the next one (browsers
     refuse to re-grant it on a freshly-loaded document, even
     though that navigation was itself a click). This document
     never navigates — only the iframe's src does — so fullscreen
     requested HERE survives every slide change underneath it.

     Each slide's own fullscreen button (deck.js) detects it's
     running inside this frame and hands control here via
     postMessage instead of calling requestFullscreen() on
     itself; this page grants it and reports the resulting state
     back so the button's icon/letterboxing stay in sync. See the
     "inFrame" branch in deck.js.

     The actual first slide lives in 01-opener.html — this file
     used to BE that slide, but the shell has to be a document
     that never navigates, so the slide moved out into its own
     file and this became the permanent wrapper around it.
     ============================================================ */
  html, body {
    margin: 0;
    height: 100%;
    background: #06080c;
    overflow: hidden;
  }
  iframe {
    display: block;
    width: 100vw;
    height: 100vh;
    border: 0;
  }
</style>
</head>
<body>

<iframe id="deckFrame" src="01-opener.html" allow="fullscreen" title="The Spectrum of Marathwada — CMIA presentation"></iframe>

<script>
(() => {
  "use strict";

  const frame = document.getElementById("deckFrame");

  const FALLBACK = "01-opener.html";
  const SLIDE_NAME = /^[0-9]{2}[a-z0-9-]*\.html$/i;

  function isFs() {
    return Boolean(document.fullscreenElement);
  }

  function reportState() {
    frame.contentWindow.postMessage(
      { source: "cmia-deck", type: "fullscreen-state", isFullscreen: isFs() },
      "*"
    );
  }

  // ---- which slide ----------------------------------------------------
  // The hash names the slide inside the frame, so this shell is linkable,
  // reloadable and bookmarkable at any point in the deck. deck.js sends a
  // slide opened directly in the address bar here as index.html#<slide>,
  // which is what this reads.
  function wanted() {
    const h = decodeURIComponent(window.location.hash.replace(/^#/, ""));
    return SLIDE_NAME.test(h) ? h : FALLBACK;
  }

  function showing() {
    try {
      return frame.contentWindow.location.pathname.split("/").pop();
    } catch (e) {
      return null;
    }
  }

  if (wanted() !== FALLBACK) frame.src = wanted();

  frame.addEventListener("load", () => {
    const name = showing();
    // replaceState, not location.hash: the arrows are the deck's history, and
    // one entry per slide would turn Back into an unpredictable second nav.
    if (name && window.location.hash !== `#${name}`) {
      history.replaceState(null, "", `#${name}`);
    }
    // Keyboard nav lives in the slide document, so focus has to follow the
    // frame — otherwise the arrow keys land on this shell and do nothing.
    try {
      frame.contentWindow.focus();
    } catch (e) {}
  });

  window.addEventListener("hashchange", () => {
    if (wanted() !== showing()) frame.src = wanted();
  });

  window.addEventListener("message", (e) => {
    const data = e.data;
    if (!data || data.source !== "cmia-deck") return;

    if (data.type === "fullscreen-toggle") {
      if (data.want && !isFs()) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (!data.want && isFs()) {
        document.exitFullscreen().catch(() => {});
      }
      return;
    }

    if (data.type === "fullscreen-query") {
      reportState();
    }
  });

  document.addEventListener("fullscreenchange", () => {
    reportState();
    // Entering fullscreen moves focus to the element that was made
    // fullscreen — this shell's root — so hand it back to the slide.
    try {
      frame.contentWindow.focus();
    } catch (e) {}
  });
})();
</script>

</body>
</html>
